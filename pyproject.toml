[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "structura-core"
version = "0.5.0"
description = "Validated Minecraft Structure NBT, Litematic and Sponge I/O, conversion and voxel geometry"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "amulet-nbt>=2.1,<3",
  "numpy>=1.26,<3",
  "scipy>=1.13,<2",
]

[project.optional-dependencies]
legacy = ["amulet-core>=1.9,<2"]

[project.scripts]
structura-convert = "structura_core.convert:main"
structura-analyze = "structura_core.analyze:main"
structura-convert-legacy = "structura_core.convert_legacy:main"
structura-export-schematic = "structura_core.export_schematic:main"
structura-check-doors = "structura_core.check_doors:main"
structura-check-leaks = "structura_core.check_leaks:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
Documentation = "https://github.com/kirimba1024/structura-core#readme"
Issues = "https://github.com/kirimba1024/structura-core/issues"
Changelog = "https://github.com/kirimba1024/structura-core/blob/main/CHANGELOG.md"
Repository = "https://github.com/kirimba1024/structura-core"

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.setuptools.package-data]
structura_core = ["py.typed", "*.pyi"]
