[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "structura-core"
version = "0.6.3"
description = "Validated Minecraft structure data and NBT/SNBT, Litematic, Sponge and Bedrock conversion"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "amulet-nbt>=2.1,<3",
  "numpy>=1.26,<3",
  "portalocker>=2.4,<3",
]

[project.optional-dependencies]
world = ["amulet-core>=1.9.35,<2"]
legacy = ["amulet-core>=1.9,<2"]
bedrock = ["amulet-core>=1.9.35,<2"]

[project.scripts]
structura-convert = "structura_core.convert:main"
structura-convert-legacy = "structura_core.convert_legacy:main"
structura-export-schematic = "structura_core.export_schematic:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
Documentation = "https://github.com/kirimba1024/structura-core#readme"
Issues = "https://github.com/kirimba1024/structura-core/issues"
Changelog = "https://github.com/kirimba1024/structura-core/blob/main/CHANGELOG.md"
Repository = "https://github.com/kirimba1024/structura-core"

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.setuptools.package-data]
structura_core = ["py.typed", "*.pyi"]
