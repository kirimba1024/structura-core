name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    permissions:
      contents: read

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
